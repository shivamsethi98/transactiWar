services:
  web:
    build: .
    container_name: transactiwar-web
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-transactiwar}
      DB_USER: ${DB_USER:-twuser}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
    volumes:
      - upload_data:/uploads
      - ./certs:/etc/apache2/certs:ro
    networks:
      - tw-network

  db:
    image: mysql:8.0
    container_name: transactiwar-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-transactiwar}
      MYSQL_USER: ${DB_USER:-twuser}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - tw-network

volumes:
  db_data:
  upload_data:

networks:
  tw-network:
    driver: bridge
