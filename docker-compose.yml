services:
  web:
    build: .
    container_name: transactiwar-web
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=transactiwar
      - DB_USER=twuser
      - DB_PASS=tw_secure_password_2026
      - APP_SECRET=a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2
    volumes:
      - upload_data:/uploads
    networks:
      - tw-network

  db:
    image: mysql:8.0
    container_name: transactiwar-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password_2026
      MYSQL_DATABASE: transactiwar
      MYSQL_USER: twuser
      MYSQL_PASSWORD: tw_secure_password_2026
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - tw-network

volumes:
  db_data:
  upload_data:

networks:
  tw-network:
    driver: bridge
