; TransactiWar - Hardened PHP Configuration

; Error handling - never expose errors to users
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL

; Disable dangerous functions
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source,proc_nice,proc_terminate,proc_get_status,proc_close

; URL access restrictions
allow_url_fopen = Off
allow_url_include = Off

; File upload limits
upload_max_filesize = 2M
post_max_size = 3M
max_file_uploads = 1

; Resource limits
max_execution_time = 30
max_input_time = 30
memory_limit = 128M

; Session security
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.gc_maxlifetime = 1800
session.sid_length = 48
session.sid_bits_per_character = 6

; Input limits
max_input_vars = 100

; Open basedir restriction
open_basedir = /var/www/html/:/tmp/:/uploads/

; Timezone
date.timezone = Asia/Kolkata
